services:
  postgres:
    image: postgres:17-alpine
    container_name: workstock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - workstock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Workstock.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__WorkstockDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: ${WORKSTOCK_ORIGIN:-http://localhost:8080}
      Storage__LocalPath: /data/uploads
      Database__AutoMigrate: "true"
      Security__ForceHttps: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workstock-uploads:/data/uploads

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      - api

volumes:
  workstock-postgres-data:
  workstock-uploads:
