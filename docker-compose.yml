services:
  postgres:
    image: postgres:17-alpine
    container_name: workstock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - workstock-postgres-data:/var/lib/postgresql/data

volumes:
  workstock-postgres-data: